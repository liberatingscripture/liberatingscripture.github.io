# Dependabot configuration — scheduled version updates.
#
# Why this file exists: without it, Dependabot runs on GitHub's UI defaults,
# which open ONE PR PER DEPENDENCY and watch only the repo root. That produced
# a scattered pile of four single-package PRs on 2026-07-28, all of which went
# stale within the hour when a manual Astro 7 upgrade swept the same versions
# in. Grouping collapses that into one reviewable PR per stream.
#
# IMPORTANT — what this file does NOT cover: grouping applies to *scheduled
# version updates* only. Dependabot SECURITY updates (driven by advisories,
# toggled in Settings → Security) still open an individual PR per advisory no
# matter what is configured here. See CLAUDE.md → Deployment for that tradeoff.

version: 2

updates:
  # ---------------------------------------------------------------------------
  # Stream 1 — the site itself (Astro, sitemap, fonts, and the build-time image
  # tooling in scripts/). This is the tree the UI defaults were already
  # watching; grouping is the only thing that changes for it.
  # ---------------------------------------------------------------------------
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    # 8, against 9 direct dependencies. Raised from 5 when the 0.x
    # exclude-patterns went in: every exclusion converts a package from "rides
    # in the group PR" to "gets its own PR", so the worst-case PR count for
    # this stream went up, and a starved stream fails SILENTLY — nothing
    # reports the update that never got a slot (see the actions stream below,
    # where a limit of 3 swallowed setup-node's bump entirely).
    open-pull-requests-limit: 8
    commit-message:
      # Matches this repo's Conventional Commits convention (lowercase type +
      # scope, e.g. "perf(images):", "docs(privacy):").
      #
      # The prefix is bare "chore" ON PURPOSE. `include: scope` makes Dependabot
      # append the scope itself — "(deps)" for runtime deps, "(deps-dev)" for
      # dev deps — so this yields "chore(deps):" / "chore(deps-dev):". Writing
      # the scope into the prefix as well produced the doubled
      # "chore(deps)(deps): bump …" subjects seen on the first run. Set one or
      # the other, never both.
      prefix: "chore"
      include: scope
    # NO `ignore:` ENTRY FOR typescript — deliberately, and it is worth knowing
    # why, because a failing TypeScript 7 PR looks exactly like something that
    # wants "fixing" with one.
    #
    # TS 7 genuinely cannot merge today: @astrojs/check (0.9.10, its latest)
    # declares peer typescript@"^5.0.0 || ^6.0.0", so `npm ci` dies with
    # ERESOLVE — that was PR #32, closed 2026-07-28. An ignore would hide the
    # PR, and hiding it is the problem: the PR turning green IS the notification
    # that upstream widened the range. Suppress it and nothing ever tells you;
    # you are left with a code comment nobody re-reads. An ignore also applies
    # to SECURITY updates, so it would mute a genuine typescript advisory whose
    # only remedy is 7.x.
    #
    # So a red TypeScript PR here is EXPECTED, not breakage. Leave it open or
    # close it — closing suppresses that specific version, and a new one only
    # arrives when a new stable 7.x ships. Check whether it is finally mergeable
    # with:  npm view @astrojs/check peerDependencies
    # When that range includes ^7, merge the PR. Matches litbible.net's repo,
    # which reached the same conclusion independently.
    groups:
      # Minor + patch ride together: they are the routine, low-risk stream, and
      # one PR means one `npm ci` + one CI run instead of five.
      site-minor-and-patch:
        patterns:
          - "*"
        # 0.x DEPENDENCIES ARE EXCLUDED, and this is not fussiness — it is the
        # hole that let a breaking change into a "patch" PR on 2026-08-03.
        #
        # Under npm caret rules a 0.x minor IS breaking: ^0.19.0 resolves to
        # >=0.19.0 <0.20.0, so 0.19 → 0.20 is a range rewrite, not an in-range
        # bump. Dependabot's semver classifier disagrees — it grades that same
        # bump `minor`, which matches `update-types` below and sweeps it into
        # the group. The net effect is that the "majors are ungrouped" rule
        # further down silently does not apply to any 0.x package.
        #
        # That is exactly how PR #41 arrived: @cloudflare/vitest-pool-workers
        # 0.19.0 → 0.20.1 rode in as a grouped "minor" while carrying release
        # notes headed "Breaking change", an alpha miniflare 5, and a
        # transitive zod 3 → 4. Excluded here, each of these gets its own PR
        # regardless of how Dependabot grades it.
        #
        # Keep this list in sync with the 0.x entries in package.json:
        #   node -e "const p=require('./package.json');for(const [n,r] of
        #     Object.entries({...p.dependencies,...p.devDependencies}))
        #     if(/^\D*0\./.test(r))console.log(n)"
        exclude-patterns:
          - "@astrojs/check"
          - "sharp"
        update-types:
          - minor
          - patch
    # NOTE: majors are deliberately NOT listed in any group above. Anything that
    # doesn't match a group's update-types falls out into its own PR, which is
    # exactly what we want — a major needs the changelog read and the built
    # output diffed by hand. The Astro 6 → 7 bump is the standing example: it
    # silently rewrote every CSS breakpoint into range syntax and needed
    # `vite.build.cssTarget` pinned in astro.config.mjs to stay correct on older
    # browsers (see CLAUDE.md → "Why cssTarget is pinned"). That is not a thing
    # to discover inside a bundle of patch bumps.

  # ---------------------------------------------------------------------------
  # Stream 2 — the contact-form Cloudflare Worker. THIS TREE WAS UNWATCHED.
  # It has its own package.json and its own package-lock.json that the root
  # `npm ci` never touches (CI gives it a separate `npm ci` in the worker-tests
  # job), so GitHub's root-only defaults saw none of it — including wrangler,
  # vitest, and @cloudflare/vitest-pool-workers. Deployed separately via
  # wrangler, so a stale dep here rots quietly until a deploy fails.
  # ---------------------------------------------------------------------------
  - package-ecosystem: npm
    directory: "/workers/contact-form"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    # 5, against 4 direct dependencies — raised from 3 for the same reason as
    # stream 1. With @cloudflare/vitest-pool-workers now excluded from the
    # group, this stream can legitimately want a group PR plus one per excluded
    # or major package at the same time, which 3 could not hold.
    open-pull-requests-limit: 5
    commit-message:
      # Bare "chore" + include: scope — see stream 1 for why the scope must not
      # also be written into the prefix.
      prefix: "chore"
      include: scope
    groups:
      worker-minor-and-patch:
        patterns:
          - "*"
        # Same 0.x exclusion as stream 1 — see the long comment there for why a
        # 0.x "minor" is really a major. This is the stream that proved it:
        # @cloudflare/vitest-pool-workers is the package PR #41 slipped through
        # on, and it is the worst possible one to bundle, because the pool
        # boots the workerd runtime the tests run inside (its 0.20.0 notes drop
        # miniflare override options and move to a miniflare 5 ALPHA).
        exclude-patterns:
          - "@cloudflare/vitest-pool-workers"
        update-types:
          - minor
          - patch
    # Majors ungrouped here too, and they matter more than usual: a wrangler
    # major can change wrangler.toml's schema, and a vitest /
    # @cloudflare/vitest-pool-workers major has to move in lockstep with the
    # workerd runtime the tests boot. Each gets its own PR.

  # ---------------------------------------------------------------------------
  # Stream 3 — GitHub Actions used by .github/workflows/deploy.yml
  # (checkout, setup-node, upload-pages-artifact, deploy-pages). Monthly: these
  # move slowly, and a stale action is a CI concern, not a shipped-code one.
  # ---------------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    # 5, not 3. There are four actions in deploy.yml and majors are ungrouped,
    # so a limit of 3 silently starved setup-node on the first run: checkout,
    # deploy-pages and upload-pages-artifact filled every slot and setup-node's
    # bump never got a PR at all. Keep this at least one above the action count.
    open-pull-requests-limit: 5
    commit-message:
      # No `include: scope` here — the scope is already "(actions)", and adding
      # it would render "chore(actions)(deps):".
      prefix: "chore(actions)"
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    # Ungrouped majors again. Action majors are the ones that break the deploy
    # outright (a deploy-pages or upload-pages-artifact major can change the
    # Pages artifact contract), so they should never arrive bundled.
