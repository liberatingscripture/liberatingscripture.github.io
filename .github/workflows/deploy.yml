name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      # Verify every internal href/#fragment in dist/ resolves (no network).
      - run: npm run check:links
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/
          # REQUIRED — do not remove. As of v4 this action excludes dotfiles and
          # dot-directories by default, and dist/ contains .well-known/ (the
          # Apple Pay domain-verification file the Give Lively donate widget
          # needs, plus security.txt). Without this the deploy silently ships a
          # site missing /.well-known/ and nothing in CI catches it: check:links
          # inspects dist/ *before* the upload, and the deploy job below never
          # runs on a pull request.
          include-hidden-files: true

  # The contact-form Worker is a separate package with its own dependency tree
  # (deliberately — it keeps vitest/workerd out of the site's root deps), so the
  # root `npm ci` above never installs it and its tests need their own job. It
  # runs on pushes and PRs but is not a deploy dependency.
  worker-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/contact-form
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/contact-form/package-lock.json
      - run: npm ci
      - run: npm test

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # The `pages` singleton belongs HERE, on the deploy job, not at the workflow
    # level. GitHub Pages only requires that real *deployments* be serialized —
    # scoping it to the workflow made every PR contend for one global slot, so a
    # batch of PRs opened together cancelled each other's builds before they ran
    # (three of five Dependabot PRs got zero checks on 2026-07-28 this way).
    # Grouped Dependabot delivers PRs in batches by design, so keep it job-level.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
