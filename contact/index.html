<body>

  <div id="siteHeader"></div>

  <main class="main-content">

<div class="contact-intro">
  <div class="contact-copy">
    <h1>Contact</h1>

    <p>
      Interested in connecting? Send a message to the Liberating Scripture Collective. We’ll respond as soon as we can.
    </p>
  </div>

  <img
    src="/assets/images/lsc-logo-text.png"
    alt="Liberating Scripture Collective wordmark"
    class="contact-logo"
  />
</div>

    <form class="contact-form" action="https://formspree.io/f/xdkqvlkj" method="POST">
      <label class="field">
        <span>Your name</span>
        <input type="text" name="name" autocomplete="name" />
      </label>

      <label class="field">
        <span>Your email</span>
        <input type="email" name="email" required autocomplete="email" />
      </label>

      <label class="field">
        <span>Message</span>
        <textarea name="message" rows="7" required></textarea>
      </label>

      <!-- Optional: subject line for nicer inbox scanning -->
      <input type="hidden" name="_subject" value="New message — Liberating Scripture Collective" />

      <!-- Honeypot anti-spam (Formspree respects this) -->
      <label class="hp" aria-hidden="true">
        <span>Leave this field empty</span>
        <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" />
      </label>

      <button type="submit">Send message</button>
    </form>

    <p class="small-text">
      This form sends your message to our email inbox and is not intended for sensitive personal information.
    </p>

    <p class="small-text">
      We will never sell or share your information.
    </p>

  </main>

<div id="siteFooter"></div>

<script src="/assets/js/site.js" defer></script>
